name: Funda monitor

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: funda-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Run monitor once
        env:
          FUNDA_SEARCH_URL: "https://www.funda.nl/zoeken/koop?selected_area=[%22alkmaar,30km%22]&price=%22100000-300000%22&object_type=[%22apartment%22]&floor_area=%2260-%22&bedrooms=%221-%22"
          STATE_FILE: "state/github-state.json"
          FIRST_RUN_NOTIFY: "false"
          MAX_NEW_LISTINGS_PER_RUN: "5"
          MAX_SEARCH_PAGES: "8"
          MAX_TOP10_LISTINGS: "60"
          MAX_ANALYSIS_PHOTOS: "3"
          OPENAI_ENABLED: "true"
          OPENAI_MODEL: "gpt-4.1-mini"
          OPENAI_AUTO_ANALYZE_NEW_LISTINGS: "true"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_ENABLED: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/funda-monitor.mjs --once

      - name: Persist monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/github-state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update Funda monitor state"
            git push
          fi
